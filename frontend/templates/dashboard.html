<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - AttritionApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .iframe-container {
            width: 100%;
            height: 82vh;
            border: none;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
        }
        .header-card {
            border-radius: 16px;
            border-left: 6px solid #4facfe;
            background: linear-gradient(135deg, #ffffff 0%, #fcfdfe 100%);
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="/">AttritionApp</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto fw-medium">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/dashboard">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="/predict">Predict</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4 px-3 px-md-4 pb-4">
        <div class="p-3 shadow-sm mb-4 header-card d-flex flex-wrap align-items-center justify-content-between">
            <div class="d-flex align-items-center">
                <h4 class="mb-0 text-dark fw-bold" style="letter-spacing: -0.5px;">Executive HR Dashboard</h4>
                <span class="ms-3 text-muted d-none d-md-block">Powered by Google Looker Studio</span>
            </div>
            <span class="badge bg-primary rounded-pill px-3 py-2 mt-2 mt-md-0 shadow-sm" style="background: linear-gradient(135deg, #4facfe, #00f2fe) !important;">Live Intelligence</span>
        </div>
        
        <!-- Replace src parameter below with your real Google Looker Studio Embed Link -->
        <iframe class="iframe-container bg-white" src="https://lookerstudio.google.com/embed/reporting/2a469da0-819d-4f6f-bab2-9b1f6c734619/page/6T3qF" allowfullscreen></iframe>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
